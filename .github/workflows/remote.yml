name: Remote MCP image and uptime monitoring

on:
  push:
    branches: ['feat/rebuild']
  pull_request:
    branches: ['feat/rebuild']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build multi-architecture image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log into GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/esreddy2/umich-dining-mcp:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Scan local container image for vulnerabilities
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build native runner image
        run: docker build -t umich-dining-mcp:scan .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: umich-dining-mcp:scan
          scan-type: image
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

  uptime:
    name: Uptime without upstream requests
    if: github.event_name == 'schedule' && vars.UMICH_UPTIME_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check public health only
        run: curl -fsS --max-time 15 https://umich-dining-mcp.duckdns.org/healthz
