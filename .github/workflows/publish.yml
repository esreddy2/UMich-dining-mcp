name: Publish

# The publish happens when a version tag is pushed.  The npm package is
# published with OIDC: the workflow asks for a short-lived token from npm and
# gets it, so no token is stored in the repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Never cache in a release build: the cache is not the build.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          published="$(npm view "umich-dining-mcp@${version}" version 2>/dev/null || true)"
          if [ "${published}" = "${version}" ]; then
            echo "umich-dining-mcp@${version} is on npm already; nothing to publish."
            exit 0
          fi
          if [ "$(node -p "require('./package.json').version")" != "${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} and the version in package.json do not match."
            exit 1
          fi
          npm publish --access public
