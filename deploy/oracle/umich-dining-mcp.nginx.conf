# Isolated HTTPS virtual host. Existing NGINX port 80 remains available for
# the two DuckDNS certificates' webroot HTTP-01 renewal challenges.
limit_req_zone $binary_remote_addr zone=umich_dining_mcp:10m rate=60r/m;

# The access log names the request and the answer and nothing else: no
# request body, no Authorization header, no cookie.
log_format umich_dining_mcp '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name umich-dining-mcp.duckdns.org;
    root /usr/share/nginx/html;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    # The domain is written out: $host comes from the client's Host header,
    # and a redirect built from it is an open redirect.
    location / { return 308 https://umich-dining-mcp.duckdns.org$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name umich-dining-mcp.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/umich-dining-mcp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umich-dining-mcp.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/umich-dining-mcp.access.log umich_dining_mcp;
    error_log /var/log/nginx/umich-dining-mcp.error.log warn;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options 'nosniff' always;

    location = /mcp {
        limit_req zone=umich_dining_mcp burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / { return 404; }
}
